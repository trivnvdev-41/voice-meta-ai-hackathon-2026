; Slice 2: answer and hand the call to the Python AI copilot via EAGI.
; Both the Meta path and the local loopback path land here.

[from-meta]
exten => _.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,EAGI(/opt/copilot/ai_bridge.py,${PJSIP_HEADER(read,X-Wa-Meta-Cta-Payload)})
 same => n,Hangup()

[ai-agent]
exten => s,1,NoOp(AI agent entry)
 same => n,Goto(from-meta,${EXTEN},1)
