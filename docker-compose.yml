services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grv
      POSTGRES_USER: grv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./gateway/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  gateway:
    build: ./gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - redis

  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - postgres

  asterisk:
    build:
      context: .
      dockerfile: asterisk/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "5060:5060/udp"
      - "5061:5061/tcp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - astkeys:/etc/asterisk/keys

volumes:
  pgdata:
  astkeys:
